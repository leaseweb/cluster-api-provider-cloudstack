version: 2
updates:
# GitHub Actions
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  groups:
    all-github-actions:
      patterns: [ "*" ]
  commit-message:
    prefix: ":seedling:"
  labels:
    - "dependencies"
    - "actions"

# Go modules
- package-ecosystem: "gomod"
  directories:
  - "/"
  - "/test/e2e"
  - "/hack/tools"
  schedule:
    interval: "weekly"
    day: "monday"
  ## group all dependencies into a single PR.
  groups:
    all-go-mod-patch-and-minor:
      patterns: [ "*" ]
      update-types: [ "patch", "minor" ]
  ignore:
  # Ignore controller-runtime as its upgraded manually.
  - dependency-name: "sigs.k8s.io/controller-runtime"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  # Ignore capi since it's tied to controller-runtime.
  - dependency-name: "sigs.k8s.io/cluster-api"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  - dependency-name: "sigs.k8s.io/cluster-api/api"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  - dependency-name: "sigs.k8s.io/cluster-api/test"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    # Ignore capi hack/tools as it has no tags of its own and is pinned to a pseudo-version manually.
  - dependency-name: "sigs.k8s.io/cluster-api/hack/tools"
    # Ignore k8s and its transitives modules as they are upgraded manually together with controller-runtime.
  - dependency-name: "k8s.io/*"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
  - dependency-name: "github.com/prometheus/*"
    update-types: [ "version-update:semver-major", "version-update:semver-minor"]
    # Ignore indirect dependencies of k8s.io/* as they are only bumped together with k8s.io/*.
  - dependency-name: "go.opentelemetry.io/otel/exporters/otlp/otlptrace"
  - dependency-name: "go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc"
  - dependency-name: "go.opentelemetry.io/otel/sdk"
  - dependency-name: "google.golang.org/grpc"
    # Ignore kind as its upgraded manually.
  - dependency-name: "sigs.k8s.io/kind"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    # Bumping the kustomize API independently can break compatibility with client-go as they share k8s.io/kube-openapi as a dependency.
  - dependency-name: "sigs.k8s.io/kustomize/api"
    update-types: [ "version-update:semver-major", "version-update:semver-minor" ]
    # Ignore the CloudStack Go SDK as its version is pinned and upgraded manually.
  - dependency-name: "github.com/apache/cloudstack-go/v2"
    # toxiproxy v2.13.0 and later require Go 1.27, which would bump the go directive.
  - dependency-name: "github.com/Shopify/toxiproxy/v2"
    versions: [ ">= 2.13.0" ]
  commit-message:
    prefix: ":seedling:"
  labels:
    - "dependencies"
    - "go"
